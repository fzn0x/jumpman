name: Feature request
description: Suggest an idea for Jumpman
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Jumpman help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
