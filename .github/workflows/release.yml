name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build web bundle and Android APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version from tag
        run: |
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Build self-hostable web bundle
        run: pnpm --filter @jumpman/web build
      - name: Package web bundle
        run: |
          mkdir -p release
          cd apps/web/dist
          zip -qr "../../../release/jumpman-web-$TAG.zip" .

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Sync Capacitor
        run: pnpm --filter @jumpman/web exec cap sync android
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "JUMPMAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will be signed with a debug key."
          fi
      - name: Build APK
        working-directory: apps/web/android
        env:
          JUMPMAN_VERSION_NAME: ${{ env.VERSION }}
          JUMPMAN_VERSION_CODE: ${{ env.VERSION_CODE }}
          JUMPMAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JUMPMAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JUMPMAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../../../release/jumpman-android-$TAG.apk"
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Jumpman ${{ env.TAG }}
          generate_release_notes: true
          files: release/*
